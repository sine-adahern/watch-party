[package]
name = "web"
edition.workspace = true
version.workspace = true

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.6", features = ["csr"] }
gloo-net = "0.6"
gloo-timers = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Event", "EventTarget", "File", "FileList", "Blob",
    "HtmlInputElement", "HtmlMediaElement", "HtmlVideoElement", "HtmlDivElement",
    "WebSocket", "MessageEvent", "Window", "Location", "Document", "Element", "Node",
    "Navigator", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
    "RtcPeerConnection", "RtcConfiguration", "RtcSessionDescriptionInit",
    "RtcIceCandidate", "RtcIceCandidateInit", "RtcPeerConnectionIceEvent",
    "RtcTrackEvent", "RtcRtpSender", "UrlSearchParams", "Clipboard",
] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
