[package]
name = "web"
edition.workspace = true
version.workspace = true

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.6", features = ["csr"] }
gloo-net = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Blob",
    "HtmlInputElement",
] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
