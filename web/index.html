<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch Party</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 4px; }
      h2 { margin-top: 28px; }
      .hint { color: #888; margin-top: 0; }
      .upload { display: inline-block; margin: 12px 0; }
      .player { width: 100%; border-radius: 12px; background: #000; margin: 12px 0; }
      .status { min-height: 1.2em; color: #888; }
      .empty { color: #888; }
      .join { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
      .inp { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #8886; background: transparent; }
      .join button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #8886; cursor: pointer; }
      .room-bar { color: #4a8; font-weight: 500; margin: 12px 0; }
      .peers { list-style: none; padding: 0; }
      .peers li { padding: 4px 0; color: #666; }
      .library { list-style: none; padding: 0; }
      .library li { margin: 6px 0; }
      .library button {
        font: inherit; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #8884; background: transparent; cursor: pointer;
        width: 100%; text-align: left;
      }
      .library button:hover { border-color: #888; }
      .call { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin: 12px 0; }
      .remotes { display: flex; gap: 8px; flex-wrap: wrap; }
      .me, .remote { width: 180px; height: 135px; object-fit: cover; border-radius: 10px; background: #111; }
      .me { outline: 2px solid #4a8; }
      .room-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: #4a8; font-weight: 500; margin: 12px 0; }
      .link { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #4a8; background: transparent; color: #4a8; cursor: pointer; }
      .library li { display: flex; gap: 8px; align-items: center; }
      .library .pick { flex: 1; width: auto; }
      .library .del { width: auto; border-color: #c66; color: #c66; padding: 8px 12px; line-height: 1; }
    </style>
  </head>
  <body></body>
</html>
