# Minimal coturn config for the watch-party call's TURN fallback.
# Install: apt-get install coturn ; then run: turnserver -c deploy/coturn.conf
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=watchparty.example.com
# Create a long-term credential and reference it in the client iceServers:
user=party:CHANGE_ME_SECRET
# external-ip=YOUR.PUBLIC.IP
# For TLS (recommended in production):
# cert=/etc/letsencrypt/live/watchparty.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/watchparty.example.com/privkey.pem
